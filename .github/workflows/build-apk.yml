name: Construire l'application Android (APK)

on:
  push:
    paths-ignore:
      - 'App/**'
      - 'SharedUI/**'
      - 'Widget/**'
      - 'Synaxaire.xcodeproj/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../Synaxaire.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Synaxaire-apk
          path: Synaxaire.apk
          retention-days: 30

      - name: Journal de compilation (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-android
          path: gradle.log
